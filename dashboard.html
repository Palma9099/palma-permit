<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Palma Permit</title>
<meta name="description" content="Your Palma Permit member dashboard.">
<meta name="theme-color" content="#0a0f1c">
<meta property="og:title" content="Dashboard - Palma Permit">
<meta property="og:description" content="Your Palma Permit member dashboard.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="" data-pp-page="dashboard" data-pp-guard="member">
<div id="app-header"></div>

<main>
  <section class="section tight"><div class="wrap">
      <span class="eyebrow">Dashboard</span>
      <h1 id="dash-welcome" style="font-size:clamp(1.8rem,3vw,2.4rem)">Welcome.</h1>
      <p class="muted" id="dash-email"></p>
      <p id="dash-msg"></p>
      <div class="grid grid-3" style="margin-top:18px">
        <div class="card pad"><h3>Plan</h3><p style="font-size:1.4rem"><b id="dash-plan">-</b></p>
          <a class="btn btn-primary" id="dash-upgrade" href="/pricing">Upgrade</a>
          <a class="btn btn-ghost" id="dash-manage" href="#" data-pp-portal>Manage billing</a></div>
        <div class="card pad"><h3>Reports</h3><p style="font-size:1.05rem"><b id="dash-credits">-</b></p><p class="muted" id="dash-counts" style="font-size:.9rem"></p>
          <a class="btn btn-primary" href="/search">Start new search</a></div>
        <div class="card pad"><h3>Help</h3><p class="muted" style="font-size:.95rem">Questions about a permit package or your account?</p>
          <a class="btn btn-ghost" href="/contact">Contact support</a>
          <a class="btn btn-ghost" href="/faq">FAQ</a>
          <a class="btn btn-ghost" id="dash-admin-link" href="/admin" style="display:none">Admin</a></div>
      </div>
      <h2 style="margin-top:34px">Recent reports</h2>
      <div id="dash-reports" class="stack"><p class="muted">Loading…</p></div>
      <p style="margin-top:8px"><a href="/reports">All reports →</a></p>
      <h2 style="margin-top:28px">Saved searches</h2>
      <div id="dash-searches" class="stack"><p class="muted">Loading…</p></div>
  </div></section>
</main>

<div id="app-footer"></div>
<script src="/assets/data.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/member.js"></script>
</body>
</html>
