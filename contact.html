<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Palma Permit</title>
<meta name="description" content="Contact Palma Permit support and sales.">
<meta name="theme-color" content="#0a0f1c">
<meta property="og:title" content="Contact - Palma Permit">
<meta property="og:description" content="Contact Palma Permit support and sales.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="Contact" data-pp-page="contact">
<div id="app-header"></div>

<main>
  <section class="section tight"><div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1 style="font-size:clamp(1.9rem,3.5vw,2.7rem)">Talk to us</h1>
      <p class="lead">Support, sales, or permit questions - we read everything.</p>
      <div class="grid grid-2" style="margin-top:24px;max-width:860px">
        <form id="contact-form" class="card pad-lg">
          <label>Name<br><input id="c-name" maxlength="120" style="width:100%"></label><br><br>
          <label>Email<br><input id="c-email" type="email" maxlength="200" style="width:100%"></label><br><br>
          <label>Message<br><textarea id="c-message" required rows="6" maxlength="5000" style="width:100%"></textarea></label><br><br>
          <button class="btn btn-primary" id="contact-submit" type="submit">Send message</button>
        </form>
        <div class="card pad">
          <h3>Other channels</h3>
          <p class="muted">Sales &amp; enterprise: <a href="mailto:sales@palma.llc">sales@palma.llc</a></p>
          <p class="muted">Members: fastest responses come through this form while signed in - it links your account automatically.</p>
        </div>
      </div>
      <p id="contact-msg" style="margin-top:14px"></p>
  </div></section>
</main>

<div id="app-footer"></div>
<script src="/assets/data.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/member.js"></script>
</body>
</html>
